name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Dockerfile Railway builds, so a broken image fails here before it reaches deploy.
      - run: docker build -t jonj-bonfire-bot .
